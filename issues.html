<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HRI — Issues &amp; Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">HRI <span>Production Monitor</span></div>
  <div class="nav-links">
    <a href="index.html">Portfolio</a>
    <a href="estimator.html">Estimate Calculator</a>
    <a class="current">Issues &amp; Notes</a>
  </div>
</header>

<main>
  <div class="section-label">Portfolio</div>
  <div class="section-title">Issues &amp; Notes</div>
  <div class="section-sub">Months flagged "Attention" (below 90% of estimate) across all sites. Reasons can be filled in directly in each site's tab in your tracker.</div>

  <div class="portfolio-strip" id="issueStats"></div>
  <div class="filters" id="siteFilterWrap"></div>

  <div class="panel">
    <h3>Flagged Months</h3>
    <div id="issuesList"></div>
  </div>
</main>

<script src="data.js"></script>
<script>
const SITES = SITES_DATA;
let siteFilter = "all";

function collectFlagged(){
  const flagged = [];
  SITES.forEach(s=>{
    s.monthly.forEach(m=>{
      if(m.status && String(m.status).toLowerCase()==="attention"){
        flagged.push({ site_number: s.site_number, client_name: s.client_name, address: s.address, ...m });
      }
    });
  });
  flagged.sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  return flagged;
}

function renderIssues(){
  const all = collectFlagged();
  const bySite = siteFilter==="all" ? all : all.filter(f=>f.site_number===siteFilter);
  const sitesWithIssues = [...new Set(all.map(f=>f.site_number))];

  document.getElementById('issueStats').innerHTML = `
    <div class="stat"><div class="num mono warn">${all.length}</div><div class="lbl">Total Flagged Months</div></div>
    <div class="stat"><div class="num mono warn">${sitesWithIssues.length}</div><div class="lbl">Sites With Flags</div></div>
    <div class="stat"><div class="num mono">${SITES.length}</div><div class="lbl">Total Sites</div></div>
  `;

  const filterWrap = document.getElementById('siteFilterWrap');
  const opts = [["all","All Sites"]].concat(sitesWithIssues.map(sn=>[sn, sn]));
  filterWrap.innerHTML = opts.map(([k,l])=>`<button data-f="${k}" class="${siteFilter===k?'active':''}">${l}</button>`).join("");
  filterWrap.querySelectorAll('button').forEach(b=>b.onclick=()=>{ siteFilter=b.dataset.f; renderIssues(); });

  const listEl = document.getElementById('issuesList');
  if(bySite.length === 0){
    listEl.innerHTML = `<div class="panel-empty">No flagged months${siteFilter!=="all" ? " for this site" : ""}. 🎉</div>`;
    return;
  }
  listEl.innerHTML = bySite.map(f=>`
    <div class="issue-row">
      <div class="issue-date">${f.date}</div>
      <div class="issue-site">${f.site_number}${f.client_name?" · "+f.client_name:""}</div>
      <div class="issue-text">${f.actual_kwh.toLocaleString()} kWh actual vs ${Math.round(f.estimate_kwh).toLocaleString()} kWh estimate (${(f.pct*100).toFixed(0)}%)</div>
    </div>
  `).join("");
}

const params = new URLSearchParams(window.location.search);
const presetSite = params.get("site");
if(presetSite) siteFilter = presetSite;

renderIssues();
</script>
</body>
</html>
