<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HRI — Production Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">HRI <span>Production Monitor</span></div>
  <div class="nav-links">
    <input class="searchbar" id="searchBox" placeholder="Search by site, client, or address…">
    <a class="current">Portfolio</a>
    <a href="estimator.html">Estimate Calculator</a>
    <a href="issues.html">Issues &amp; Notes</a>
  </div>
</header>

<main>
  <div id="overview">
    <div class="section-label">Portfolio</div>
    <div class="section-title">HRI Sites — Overview</div>
    <div class="section-sub">Data as of last export from your tracker. <span id="dataAsOf"></span></div>
    <div class="panel" style="padding:16px 20px; margin-bottom:20px;">
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <label class="mono" style="font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px;">Viewing Year</label>
        <select class="select-input" id="yearSelect" style="width:auto; max-width:160px;"></select>
        <span style="font-size:12px; color:var(--text-dim);">Every site below recalculates for the selected calendar year. Sites without data for that year show "No Data".</span>
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="portfolio-strip" id="portfolioStrip"></div>
    <div class="grid" id="siteGrid"></div>
    <div class="no-results hidden" id="noResults">No sites match your search.</div>
  </div>

  <div id="detail" class="hidden">
    <button class="back-btn" onclick="showOverview()">&larr; Back to portfolio</button>
    <div class="detail-head">
      <div class="detail-title" id="dTitle"></div>
      <div class="detail-meta" id="dMeta"></div>
    </div>
    <div id="dBody"></div>
  </div>
</main>

<script src="data.js"></script>
<script>
const SITES = SITES_DATA;
let selectedYear = null;
let currentFilter = "all";

function yearFromDateStr(str){
  if(!str) return null;
  const m = String(str).match(/(\d{4})/);
  return m ? parseInt(m[1]) : null;
}

function computeAvailableYears(sites){
  const set = new Set();
  const nowYear = new Date().getFullYear();
  sites.forEach(s=>{
    s.monthly.forEach(m=>{ const y = yearFromDateStr(m.date); if(y) set.add(y); });
    s.annual.forEach(a=>{ if(a.calendar_year) set.add(Math.round(a.calendar_year)); });
  });
  // Exclude spreadsheet date-epoch artifacts (blank date cells often evaluate to ~1899)
  // and cap how far into the future we show, since only elapsed years have real production data.
  return [...set].filter(y => y >= 2000 && y <= nowYear + 1).sort((a,b)=>a-b);
}

function getYearPerformance(site, year){
  if(typeof site.inverter === "string" && site.inverter.trim().toLowerCase()==="inactive"){
    return { status:"inactive", pct:null, actual:0, estimate:0 };
  }
  const months = site.monthly.filter(m => yearFromDateStr(m.date) === year);
  if(months.length === 0) return { status:"nodata", pct:null, actual:0, estimate:0 };
  const actual = months.reduce((a,m)=>a+m.actual_kwh,0);
  const estimate = months.reduce((a,m)=>a+m.estimate_kwh,0);
  const pct = estimate>0 ? actual/estimate : null;
  let status;
  if(pct===null) status = "nodata";
  else status = pct>=0.95 ? "ok" : (pct<0.90 ? "attn" : "watch");
  return { status, pct, actual, estimate };
}

function populateYearSelect(){
  let years = computeAvailableYears(SITES);
  const nowYear = new Date().getFullYear();
  if(years.length === 0) years = [nowYear];
  const sel = document.getElementById('yearSelect');
  sel.innerHTML = years.map(y=>`<option value="${y}">${y}</option>`).join("");
  selectedYear = years.includes(nowYear) ? nowYear : years[years.length-1];
  sel.value = selectedYear;
  sel.onchange = ()=>{ selectedYear = parseInt(sel.value); renderGrid(); };
}

function pillClassOf(s){ return { ok:"pill-ok", watch:"pill-watch", attn:"pill-attn", pending:"pill-pending", inactive:"pill-inactive", nodata:"pill-pending" }[s]; }
function pillLabelOf(s){ return { ok:"On Target", watch:"Watch", attn:"Attention", pending:"Awaiting Data", inactive:"Inactive", nodata:"No Data" }[s]; }

function renderFilters(list){
  const counts = { all: list.length, ok:0, watch:0, attn:0, nodata:0, inactive:0 };
  list.forEach(s=>{ const st = getYearPerformance(s, selectedYear).status; counts[st] = (counts[st]||0)+1; });
  const opts = [
    ["all","All Sites"], ["attn","Attention"], ["watch","Watch"],
    ["ok","On Target"], ["nodata","No Data"], ["inactive","Inactive"]
  ];
  const el = document.getElementById('filters');
  el.innerHTML = opts.map(([k,l])=>`<button data-f="${k}" class="${currentFilter===k?'active':''}">${l} (${counts[k]||0})</button>`).join("");
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ currentFilter=b.dataset.f; renderGrid(); });
}

function renderPortfolioStrip(list){
  let totalAct=0, totalEst=0, withData=0;
  list.forEach(s=>{
    const perf = getYearPerformance(s, selectedYear);
    if(perf.status!=="nodata" && perf.status!=="inactive"){ totalAct+=perf.actual; totalEst+=perf.estimate; withData++; }
  });
  const pct = totalEst>0 ? (totalAct/totalEst*100).toFixed(1) : "—";
  document.getElementById('portfolioStrip').innerHTML = `
    <div class="stat"><div class="num mono">${list.length}</div><div class="lbl">Total Sites</div></div>
    <div class="stat"><div class="num mono">${withData}</div><div class="lbl">Reporting Data for ${selectedYear}</div></div>
    <div class="stat"><div class="num mono ${pct!=="—" && pct>=95?'ok':(pct!=="—"&&pct<90?'warn':'')}">${pct}${pct!=="—"?"%":""}</div><div class="lbl">Portfolio % of Target — ${selectedYear}</div></div>
  `;
}

function matchesSearch(site,q){
  if(!q) return true;
  q=q.toLowerCase();
  return (site.client_name||"").toLowerCase().includes(q) || (site.address||"").toLowerCase().includes(q) || (site.site_number||"").toLowerCase().includes(q);
}

function renderGrid(){
  const q = document.getElementById('searchBox').value;
  let searchList = SITES.filter(s=>matchesSearch(s,q));
  renderPortfolioStrip(searchList);
  renderFilters(searchList);

  let list = currentFilter==="all" ? searchList : searchList.filter(s=>getYearPerformance(s, selectedYear).status===currentFilter);

  const grid = document.getElementById('siteGrid');
  const noResults = document.getElementById('noResults');
  if(list.length===0){ grid.innerHTML=""; noResults.classList.remove('hidden'); return; }
  noResults.classList.add('hidden');

  grid.innerHTML = list.map((s)=>{
    const perf = getYearPerformance(s, selectedYear);
    const idx = SITES.indexOf(s);
    const pctDisplay = perf.pct!==null ? (perf.pct*100).toFixed(1)+"%" : "—";
    const pctColorClass = perf.status==="ok" ? "ok" : (perf.status==="attn" ? "warn" : "");
    const subLabel = perf.status==="nodata" ? "No data for "+selectedYear : (perf.status==="inactive" ? "System inactive" : "of estimate · "+selectedYear);
    return `<div class="card" onclick="showDetail(${idx})">
        <div class="status-pill ${pillClassOf(perf.status)}">${pillLabelOf(perf.status)}</div>
        <div class="card-top">
          <div class="card-name">${s.address||s.site_number}</div>
          <div class="card-addr">${s.client_name||""}</div>
        </div>
        <div class="gauge-wrap">
          <div class="gauge-num mono ${pctColorClass}" style="font-size:26px;">${pctDisplay}</div>
          <div class="gauge-sub">${subLabel}</div>
        </div>
      </div>`;
  }).join("");
}

function showDetail(idx){
  const s = SITES[idx];
  document.getElementById('overview').classList.add('hidden');
  document.getElementById('detail').classList.remove('hidden');
  document.getElementById('dTitle').textContent = `${s.site_number} — ${s.client_name||"Unnamed Site"}`;
  document.getElementById('dMeta').innerHTML = `
    <b>${s.address||"—"}</b> &nbsp;·&nbsp; Capacity: <b>${s.capacity_kw||"—"} kW</b> &nbsp;·&nbsp; Inverter: <b>${s.inverter||"—"}</b>
    ${s.activation ? ` &nbsp;·&nbsp; Activated: <b>${s.activation}</b>` : ""}
    ${s.monitoring_link ? ` &nbsp;·&nbsp; <a href="${s.monitoring_link}" target="_blank">View live monitoring →</a>` : ""}
  `;

  const body = document.getElementById('dBody');

  if(s.data_status !== "synced" || s.annual.length === 0){
    body.innerHTML = `<div class="panel">
      <h3>Production Data</h3>
      <div class="panel-empty">
        ${s.data_status==="inactive" ? "This system is marked inactive — no production monitoring is currently expected."
          : "No actual production data has synced from the monitoring API for this site yet. Once it does, monthly and annual actual-vs-estimate figures will appear here automatically."}
        ${s.est_y1_output ? `<br><br>Estimated Year 1 output on file: <b style="color:var(--text)">${Math.round(s.est_y1_output).toLocaleString()} kWh</b>` : ""}
      </div>
    </div>
    <div class="panel">
      <h3>Issues &amp; Notes</h3>
      <div class="panel-empty">See the <a href="issues.html?site=${encodeURIComponent(s.site_number)}" style="color:var(--amber);">Issues &amp; Notes page</a> for this site.</div>
    </div>`;
    return;
  }

  let matchingAnnual = s.annual.find(a => a.calendar_year === selectedYear);
  let selectedRelYear = matchingAnnual ? matchingAnnual.year : (s.monthly.length ? s.monthly[s.monthly.length-1].year : s.annual[0].year);

  function renderYearContent(){
    const monthsForYear = s.monthly.filter(m=>m.year===selectedRelYear);
    const max = Math.max(...monthsForYear.map(m=>Math.max(m.actual_kwh,m.estimate_kwh)), 1) * 1.15;
    document.getElementById('chartBoxD').innerHTML = monthsForYear.map(m=>`
      <div class="bar-pair">
        <div class="bar actual" style="height:${(m.actual_kwh/max*100).toFixed(1)}%" title="Actual: ${m.actual_kwh} kWh"></div>
        <div class="bar estimate" style="height:${(m.estimate_kwh/max*100).toFixed(1)}%" title="Estimate: ${m.estimate_kwh} kWh"></div>
      </div>`).join("");
    document.getElementById('chartLabelsD').innerHTML = monthsForYear.map(m=>`<span>${(m.month||"").slice(0,3)}</span>`).join("");

    const co2 = monthsForYear.reduce((a,m)=>a+m.co2,0);
    const homes = monthsForYear.reduce((a,m)=>a+m.homes,0);
    const carbon = monthsForYear.reduce((a,m)=>a+m.carbon,0);
    const envEl = document.getElementById('envStatsD');
    if(envEl){
      envEl.innerHTML = `
        <div class="stat"><div class="num mono ok">${co2.toLocaleString()}</div><div class="lbl">CO₂ Emissions Avoided</div></div>
        <div class="stat"><div class="num mono ok">${homes.toLocaleString()}</div><div class="lbl">Equivalent Homes Powered</div></div>
        <div class="stat"><div class="num mono ok">${carbon.toLocaleString()}</div><div class="lbl">Carbon Sequestered (tree-equiv.)</div></div>
      `;
    }
  }

  const monthYears = [...new Set(s.monthly.map(m=>m.year))];

  body.innerHTML = `
    <div class="panel">
      <h3>Monthly Production</h3>
      <div class="yearpick2" id="yearpickD"></div>
      <div class="legend"><span><i class="dot" style="background:var(--amber)"></i>Actual</span><span><i class="dot" style="background:var(--teal)"></i>Estimate</span></div>
      <div class="chartbox" id="chartBoxD"></div>
      <div class="chart-labels" id="chartLabelsD"></div>
    </div>
    <div class="panel">
      <h3>Annual Summary <small>Year 1 through Year ${s.annual.length}, as calculated in your tracker</small></h3>
      <table><thead><tr><th>Year</th><th class="num">Calendar Year</th><th class="num">Actual (MWh)</th><th class="num">Estimate (MWh)</th><th class="num">% of Estimate</th></tr></thead>
      <tbody>${s.annual.map(a=>`<tr><td>${a.year}</td><td class="num">${a.calendar_year||"—"}</td><td class="num">${a.actual_mwh.toFixed(2)}</td><td class="num">${a.estimate_mwh.toFixed(2)}</td><td class="num">${a.estimate_mwh>0?(a.pct*100).toFixed(1)+"%":"—"}</td></tr>`).join("")}</tbody></table>
    </div>
    <div class="panel">
      <h3>Environmental Impact <small>for selected year</small></h3>
      <div class="portfolio-strip" id="envStatsD" style="margin-bottom:0;"></div>
    </div>
    <div class="panel">
      <h3>Issues &amp; Notes</h3>
      <div class="panel-empty">See the <a href="issues.html?site=${encodeURIComponent(s.site_number)}" style="color:var(--amber);">Issues &amp; Notes page</a> for a full log of flagged months on this site.</div>
    </div>
  `;

  const yp = document.getElementById('yearpickD');
  yp.innerHTML = monthYears.map(y=>`<button data-y="${y}" class="${y===selectedRelYear?'active':''}">${y}</button>`).join("");
  yp.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    selectedRelYear = b.dataset.y;
    yp.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    renderYearContent();
  });
  renderYearContent();
}

function showOverview(){
  document.getElementById('detail').classList.add('hidden');
  document.getElementById('overview').classList.remove('hidden');
}

document.getElementById('searchBox').addEventListener('input', renderGrid);

populateYearSelect();
renderGrid();
</script>
</body>
</html>
